<script>
(function() {
  var c, form, list, output, panel, toggle;
  panel = document.getElementById('terminal-panel');
  toggle = document.getElementById('terminal-toggle');
  form = document.querySelector('.terminal-form');

  var PLAY_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>';
  var PAUSE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"></path></svg>';

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ':' + (s < 10 ? '0' + s : s);
  }

  function wirePlayer(audio, btn, time, dur, seek, fill) {
    function setPlaying(playing) {
      btn.innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
      btn.setAttribute('aria-label', playing ? 'pause' : 'play');
    }
    btn.addEventListener('click', function() {
      if (audio.paused) {
        var r = audio.play();
        if (r && r.catch) { r.catch(function() {}); }
      } else {
        audio.pause();
      }
    });
    audio.addEventListener('play', function() { setPlaying(true); });
    audio.addEventListener('pause', function() { setPlaying(false); });
    audio.addEventListener('ended', function() { setPlaying(false); });
    audio.addEventListener('loadedmetadata', function() {
      dur.textContent = fmt(audio.duration);
      seek.setAttribute('aria-valuemax', String(Math.floor(audio.duration) || 0));
    });
    audio.addEventListener('timeupdate', function() {
      time.textContent = fmt(audio.currentTime);
      seek.setAttribute('aria-valuenow', String(Math.floor(audio.currentTime) || 0));
      if (audio.duration) {
        fill.style.width = Math.min(100, (audio.currentTime / audio.duration) * 100) + '%';
      }
    });
    function seekTo(clientX) {
      var r = seek.getBoundingClientRect();
      if (!r.width) { return; }
      var ratio = (clientX - r.left) / r.width;
      audio.currentTime = Math.max(0, Math.min(1, ratio)) * audio.duration;
    }
    seek.addEventListener('click', function(ev) {
      if (!audio.duration) { return; }
      seekTo(ev.clientX);
    });
    seek.addEventListener('keydown', function(ev) {
      var k = ev.key;
      if (k === 'ArrowRight') { ev.preventDefault(); audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5); }
      else if (k === 'ArrowLeft') { ev.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - 5); }
      else if (k === 'Home') { ev.preventDefault(); audio.currentTime = 0; }
      else if (k === 'End') { ev.preventDefault(); audio.currentTime = audio.duration || 0; }
    });
  }

  function trackCard(track) {
    var audio, btn, card, cover, dur, fill, line, name, note, player, prop, seek, time;
    card = document.createElement('span');
    card.className = 'project';
    line = document.createElement('span');
    line.className = 'project-line';
    cover = document.createElement('img');
    cover.className = 'track-cover';
    cover.src = track.cover;
    cover.alt = '';
    line.appendChild(cover);
    prop = document.createElement('span');
    prop.className = 'prop';
    prop.style.paddingLeft = '15px';
    prop.textContent = 'track:';
    name = document.createElement('span');
    name.className = 'project-name';
    name.textContent = '"' + track.name + '",';
    line.appendChild(prop);
    line.appendChild(name);
    card.appendChild(line);
    audio = new Audio(track.url);
    audio.preload = 'none';
    player = document.createElement('span');
    player.className = 'player';
    btn = document.createElement('button');
    btn.className = 'player-btn';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'play');
    btn.innerHTML = PLAY_ICON;
    time = document.createElement('span');
    time.className = 'player-time';
    time.textContent = '0:00';
    seek = document.createElement('span');
    seek.className = 'player-seek';
    seek.setAttribute('role', 'slider');
    seek.setAttribute('aria-label', 'seek');
    seek.setAttribute('aria-valuemin', '0');
    seek.setAttribute('aria-valuemax', '0');
    seek.setAttribute('aria-valuenow', '0');
    seek.tabIndex = 0;
    fill = document.createElement('span');
    fill.className = 'player-seek-fill';
    seek.appendChild(fill);
    dur = document.createElement('span');
    dur.className = 'player-dur';
    dur.textContent = '0:00';
    player.appendChild(btn);
    player.appendChild(time);
    player.appendChild(seek);
    player.appendChild(dur);
    wirePlayer(audio, btn, time, dur, seek, fill);
    card.appendChild(player);
    note = document.createElement('span');
    note.className = 'track-note';
    note.textContent = track.note ? '// author\'s note: ' + track.note : '';
    card.appendChild(note);
    return card;
  }

  list = document.getElementById('music-list');
  fetch('api/music', { headers: { 'Accept': 'application/json' } })
    .then(function(response) { return response.json(); })
    .then(function(data) {
      if (!list) { return; }
      list.textContent = '';
      if (!data || data.length === 0) {
        c = document.createElement('span');
        c.className = 'comment';
        c.textContent = '// no tracks yet — coming soon.';
        list.appendChild(c);
        return;
      }
      for (var i = 0; i < data.length; i++) {
        list.appendChild(trackCard(data[i]));
      }
    })
    .catch(function() {
      if (!list) { return; }
      list.textContent = '';
      c = document.createElement('span');
      c.className = 'comment';
      c.textContent = '// error loading tracks — try again later.';
      list.appendChild(c);
    });

  function setOpen(open) {
    if (!panel) {
      return;
    }
    panel.classList.toggle('open', open);
    if (toggle) {
      toggle.classList.toggle('active', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    if (open && form) {
      form.querySelector('input, textarea').focus();
    }
  }

  if (toggle && panel) {
    toggle.addEventListener('click', function() {
      setOpen(!panel.classList.contains('open'));
    });
  }

  output = form ? form.querySelector('.term-output') : null;
  if (!form) {
    return;
  }
  form.addEventListener('submit', function(event) {
    event.preventDefault();
    var data = new FormData(form);
    output.textContent = '[ ... ] sending — please wait.';
    fetch(form.getAttribute('action'), {
      method: 'POST',
      body: data,
      headers: { 'Accept': 'application/json' }
    }).then(function(response) {
      if (response.ok) {
        output.textContent = '[ ok ] message sent — i\'ll get back to you soon.';
        form.reset();
      } else {
        return response.json().then(function(err) {
          throw new Error(err.errors ? err.errors.map(function(e) { return e.message; }).join(', ') : 'request failed');
        });
      }
    }).catch(function(err) {
      output.textContent = '[ error ] ' + err.message + ' — please try again.';
    }).then(function() {
      return output.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });

  var closeBtn = panel ? panel.querySelector('.term-tab-close') : null;
  if (closeBtn) {
    closeBtn.addEventListener('click', function() {
      setOpen(false);
    });
  }
})();
</script>
