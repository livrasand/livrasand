<script>
(function() {
  var form, output, panel, toggle, closeBtn;
  panel = document.getElementById('terminal-panel');
  toggle = document.getElementById('terminal-toggle');
  closeBtn = panel ? panel.querySelector('.term-tab-close') : null;
  form = document.querySelector('.terminal-form');

  function setOpen(open) {
    if (!panel) {
      return;
    }
    panel.classList.toggle('open', open);
    if (toggle) {
      toggle.classList.toggle('active', open);
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    if (open && form) {
      form.querySelector('input, textarea').focus();
    }
  }

  if (toggle && panel) {
    toggle.addEventListener('click', function() {
      setOpen(!panel.classList.contains('open'));
    });
  }

  if (closeBtn) {
    closeBtn.addEventListener('click', function() {
      setOpen(false);
    });
  }

  if (!form) {
    return;
  }
  output = form.querySelector('.term-output');
  form.addEventListener('submit', function(event) {
    event.preventDefault();
    var data = new FormData(form);
    output.textContent = '[ ... ] sending — please wait.';
    fetch(form.getAttribute('action'), {
      method: 'POST',
      body: data,
      headers: { 'Accept': 'application/json' }
    }).then(function(response) {
      if (response.ok) {
        output.textContent = '[ ok ] message sent — i\'ll get back to you soon.';
        form.reset();
      } else {
        return response.json().then(function(err) {
          throw new Error(err.errors ? err.errors.map(function(e) { return e.message; }).join(', ') : 'request failed');
        });
      }
    }).catch(function(err) {
      output.textContent = '[ error ] ' + err.message + ' — please try again.';
    }).then(function() {
      return output.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  });
})();
</script>
